name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :app:assembleDebug --no-daemon
      - run: |
          mkdir -p module/system/priv-app/AudioSplit
          cp app/build/outputs/apk/debug/app-debug.apk module/system/priv-app/AudioSplit/AudioSplit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: audiosplit-magisk
          path: module/
